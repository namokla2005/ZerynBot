name: CI

# Chạy test suite tự động cho mọi push/PR.
# Bảo vệ các quy tắc bảo mật (phân quyền 27 lệnh con, dual-mode checks) và các
# tối ưu chạy 24/7 trên Termux (PRAGMA, ngân sách thời gian AI...) khỏi bị vô
# hiệu hoá âm thầm bởi một PR nào đó.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Kiểm tra cú pháp mọi file Python
        # py_compile chỉ chứng minh file PARSE được — nó không phát hiện tên hàm sai
        # hay import thiếu trong nhánh except. Vì vậy nó là bước CHẶN nhưng không đủ,
        # nên có thêm bước ruff F821 bên dưới.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q bot database dashboard scripts *.py

      - name: Ruff — nhóm lỗi gây crash (chặn)
        # F821 = undefined name (NameError luc bot đang chạy 24/7), E9 = syntax.
        # Da bat duoc 2 loi that ma pytest khong thay: `guild_id` bi xoa khoi
        # automod.on_message, và `logger` duoc dashboard/auth.py goi trong khi module
        # khong dinh nghia no (chi no tren nhanh loi Discord API).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m ruff check . --select F821,E9 --output-format=github

      - name: Ruff — toàn bộ quy tắc còn lại (chỉ báo cáo)
        # ~240 phat hien con lai (F401 unused-import, I001 unsorted-imports...) la viec
        # ve sinh. Khong chan vi auto-fix F401 se pha cac module re-export co chu dich
        # (dashboard/app.py la compat shim, bot/cogs/music.py la facade package `music/`).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true
        run: python -m ruff check . --statistics

      - name: Đồng bộ i18n (1694 key + placeholder + ký tự điều khiển)
        # str.format thoi im lang bo kwarg thua, nen mot key dich thieu {amount} khong
        # bao gio gay loi test — chi la tin nhan mat con so tien khi ngu dung dung.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .agents/skills/zerynbot_architecture_context/assets/validate_i18n.py

      - name: Chạy test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # Giá trị giả cho CI — test tự quản lý env của nó (xem tests/test_config_security.py)
          FLASK_SECRET_KEY: "ci-only-secret-key-not-used-in-production"
          ADMIN_PASSWORD: "ci-only-admin-password"
        run: python -m pytest tests/ -q
