{# CSRF bootstrap — gắn token vào mọi request thay đổi dữ liệu (fetch + form POST) #}
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
(function () {
  var meta = document.querySelector('meta[name="csrf-token"]');
  if (!meta || !meta.content) return;
  var token = meta.content;

  // 1) Tự gắn header X-CSRF-Token cho mọi fetch() không phải GET/HEAD
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    opts = opts || {};
    var method = (opts.method || 'GET').toUpperCase();
    if (method !== 'GET' && method !== 'HEAD') {
      opts.headers = Object.assign({ 'X-CSRF-Token': token }, opts.headers || {});
    }
    return origFetch.call(this, url, opts);
  };

  // 2) Tự chèn hidden input _csrf_token vào mọi <form method="post">
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form[method]').forEach(function (f) {
      var m = (f.getAttribute('method') || '').toLowerCase();
      if (m === 'post' && !f.querySelector('input[name="_csrf_token"]')) {
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = '_csrf_token';
        input.value = token;
        f.appendChild(input);
      }
    });
  });
})();
</script>
